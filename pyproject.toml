[project]
name = "empm"
authors = [
  { name = "paopaozhi", email = "paopaozhi@hotmail.com" },
  { name = "hymn", email = "hexinyi136@139.com" },
]
description = "embedded pack manage"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
dependencies = [
    "typer>=0.12.3",
    "toml==0.10.2",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "rich>=13.7.1",
    "typing-extensions>=4.11.0",
    "uvicorn>=0.29.0",
]
dynamic = ["version"]

[project.scripts]
empm = "empm.cli.main:app"

[project.urls]
"Homepage" = "https://github.com/paopaozhi/cepack"
"Bug Tracker" = "https://github.com/paopaozhi/cepack/issues"

[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

######################################################################################
# uv
#

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

######################################################################################
# hatch
#

[tool.hatch.build]
# 将前端产物标记为构建产物（不在 VCS 里也会被打进包）
artifacts = [
  "src/empm/web/frontend/dist/**",
]

[tool.hatch.build.targets.wheel]
# 明确打包 empm 包目录（含其下的前端产物）
packages = ["src/empm"]

# 为源码构建注册钩子
[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/frontend_build.py"

[tool.hatch.version]
path = "src/empm/__init__.py"

######################################################################################
# coverage
#

[tool.coverage.run]
branch = true
omit = ["test/*","empm/_internal/command/home.py"]

[dependency-groups]
dev = [
    "hatch>=1.14.1",
    "pytest>=8.4.1",
]
